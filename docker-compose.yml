version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: shopwebsite-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: animate_dp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sh:/docker-entrypoint-initdb.d/00-init.sh
      - ./backend/db/mydb_backup.sql:/docker-entrypoint-initdb.d/01-mydb_backup.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d animate_dp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopwebsite-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopwebsite-backend
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: animate_dp
      DB_PORT: 5432
      PORT: 3002
      CORS_ORIGIN: http://localhost:5173
      SECRET_KEY: DEMO
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - shopwebsite-network
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: shopwebsite-frontend
    ports:
      - "4173:4173"
    environment:
      VITE_API_URL: http://localhost:3002
    depends_on:
      - backend
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
    networks:
      - shopwebsite-network
    command: npm run preview

volumes:
  postgres_data:
    driver: local

networks:
  shopwebsite-network:
    driver: bridge
